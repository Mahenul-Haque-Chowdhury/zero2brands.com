<div style="background-color:#f5f7f9;padding:32px 16px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
    <tr>
      <td style="background-color:#0b1f35;border-radius:12px 12px 0 0;padding:28px 32px;text-align:center;">
        <span style="font-size:22px;font-weight:800;color:#ffffff;letter-spacing:-0.01em;">
          Zero<span style="color:#00c853;">2</span>Brands
        </span>
      </td>
    </tr>
    <tr>
      <td style="background-color:#ffffff;padding:36px 32px;border-radius:0 0 12px 12px;">
        <h1 style="margin:0 0 12px;font-size:20px;font-weight:600;color:#1f2937;">Confirm your new email</h1>
        <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#5b6b7c;">
          Confirm that <strong style="color:#1f2937;">{{ .Email }}</strong> should become the email address on your Zero2Brands account.
        </p>
        <table role="presentation" cellpadding="0" cellspacing="0">
          <tr>
            <td style="border-radius:8px;background-color:#00c853;">
              <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/dashboard/settings"
                 style="display:inline-block;padding:12px 28px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">
                Confirm new email
              </a>
            </td>
          </tr>
        </table>
        <p style="margin:28px 0 0;font-size:12px;line-height:1.6;color:#9db0c2;">
          If you didn't request this change, please contact support right away.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 8px;text-align:center;">
        <p style="margin:0;font-size:12px;color:#9db0c2;">Zero2Brands, Dhaka, Bangladesh</p>
      </td>
    </tr>
  </table>
</div>
